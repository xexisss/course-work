<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/profile.css">
</head>
<body>
  <script src="js/components/preloader.js"></script>
  <header class="header">
    <div class="header__container">
      <a href="index.html" class="header__logo">
        <img src="assets/logo.png" alt="Logo" width="109" height="53"/>
      </a>
  
      <nav class="header__nav" id="header-nav">
        <ul>
          <li><a href="index.html#experience" data-i18n="header.experience">Experience</a></li>
          <li><a href="index.html#partners" data-i18n="header.partners">Partners</a></li>
          <li><a href="index.html#services" data-i18n="header.services">Services</a></li>
          <li><a href="index.html#results" data-i18n="header.results">Results</a></li>
          <li><a href="index.html#newsletter" data-i18n="header.newsletter">Newsletter</a></li>
          <button class="header_btn header_btn--eng" id="langToggle" data-lang="ru"></button>
        </ul>
      </nav>

      <div class="header__actions">
        <button class="header_btn header_btn--th" id="themeToggle"></button>
        <button class="header_btn header_btn--login" id="loginButton"></button>
        <button class="header_btn header_btn--sl" id="accessibilityToggle" area-pressed="false">👁</button>
      </div>

      <button class="header__burger" aria-label="Toggle menu" aria-expanded="false" aria-controls="header-nav">
          <span class="burger-line"></span>
          <span class="burger-line"></span>
          <span class="burger-line"></span>
      </button>

    </div>
  </header>

    <main class="profile-page">
        <div class="profile__box">
          <h1 class="profile__title">Profile</h1>
          
          <div class="profile__info">
            <p>Name: <span id="profile-name"></span></p>
            <p>Nickname: <span id="profile-nickname"></span></p>
            <p>Email: <span id="profile-email"></span></p>
            <p>Phone: <span id="profile-phone"></span></p>
          </div>

          <button class="profile__logout" id="logoutBtn">Logout</button>

          <form class="profile__form" id="passwordForm" novalidate>
  
            <div class="profile__field">
              <label for="password" class="profile__label">Password*</label>
              <input
                type="password"
                id="password-old"
                class="profile__input"
                placeholder="Old password"
                required
              />
            </div>
    
            <div class="profile__field">
              <label for="password-repeat" class="profile__label">New password*</label>
              <input
                type="password"
                id="password-new"
                class="profile__input"
                placeholder="New password"
                required
              />
            </div>

            <div class="profile__field">
                <label for="password-repeat" class="profile__label">Repeat new password*</label>
                <input
                  type="password"
                  id="password-repeat"
                  class="profile__input"
                  placeholder="Repeat password"
                  required
                />
              </div>
    
            <button type="submit" class="profile__button">Register</button>
          </form>
          <p id="passwordMessage"></p>
          <div id="container"></div>
        </div>
      </main>

      <footer class="footer">
        <div class="footer__container">
          <div class="footer__col">
            <h4 class="footer__title">Company</h4>
            <ul class="footer__list">
              <li><a href="about.html">Where are we located</a></li>
            </ul>
          </div>
          
          <div class="footer__col">
            <h4 class="footer__title">Products</h4>
            <ul class="footer__list">
              <li><a href="services.html">Our services</a></li>
            </ul>
          </div>
          
          <div class="footer__col">
            <h4 class="footer__title">Support</h4>
            <ul class="footer__list">
              <li><a href="#">Help Center</a></li>
            </ul>
          </div>
          <button class="footer__phone">+375 (29)999-99-99</button>
        </div>
      </footer>

    <script src="js/components/theme.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/pages/profile.js"></script>
    <script src="js/components/i18n.js"></script>
    <script src="js/components/lang.js"></script>
</body>
</html>
