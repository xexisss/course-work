<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/register.css">
</head>
<body>
  <header class="header">
    <div class="header__container">
      <a href="index.html" class="header__logo">
        <img src="assets/logo.png" alt="Logo" width="109" height="53"/>
      </a>
  
      <nav class="header__nav" id="header-nav">
        <ul>
          <li><a href="index.html#experience" data-i18n="header.experience">Experience</a></li>
          <li><a href="index.html#partners" data-i18n="header.partners">Partners</a></li>
          <li><a href="index.html#services" data-i18n="header.services">Services</a></li>
          <li><a href="index.html#results" data-i18n="header.results">Results</a></li>
          <li><a href="index.html#newsletter" data-i18n="header.newsletter">Newsletter</a></li>
          <button class="header_btn header_btn--eng" id="langToggle" data-lang="ru"></button>
        </ul>
      </nav>

      <div class="header__actions">
        <button class="header_btn header_btn--th" id="themeToggle"></button>
        <button class="header_btn header_btn--login" id="loginButton"></button>
        <button class="header_btn header_btn--sl" id="accessibilityToggle" area-pressed="false">👁</button>
      </div>

      <button class="header__burger" aria-label="Toggle menu" aria-expanded="false" aria-controls="header-nav">
          <span class="burger-line"></span>
          <span class="burger-line"></span>
          <span class="burger-line"></span>
      </button>

    </div>
  </header>

    <main class="registration-page">
        <div class="registration__box">
          <h1 class="registration__title" data-i18n="register.title">Registration</h1>
          <form id="registerForm" class="registration__form" novalidate>
            <div class="registration__field">
              <label for="surname" class="registration__label" data-i18n="register.surname">Surname*</label>
              <input
                type="text"
                id="surname"
                class="registration__input"
                placeholder="Enter your surname"
                required
                data-i18n="register.surname-enter"
              />
            </div>
    
            <div class="registration__field">
              <label for="name" class="registration__label" data-i18n="register.name">Name*</label>
              <input
                type="text"
                id="name"
                class="registration__input"
                placeholder="Enter your name"
                required
                data-i18n="register.name-title"
              />
            </div>
    
            <div class="registration__field">
              <label for="patronymic" class="registration__label" data-i18n="register.patronymic">Patronymic</label>
              <input
                type="text"
                id="patronymic"
                class="registration__input"
                placeholder="Enter your patronymic"
                data-i18n="register.patronymic-enter"
              />
            </div>
    
            <div class="registration__field">
              <label for="birthdate" class="registration__label" data-i18n="register.date">Date of birth*</label>
              <input
                type="date"
                id="birthdate"
                class="registration__input"
                required
                data-i18n="register.date-enter"
              />
            </div>
    
            <div class="registration__field">
              <label for="phone" class="registration__label" data-i18n="register.number">Phone number*</label>
              <input
                type="tel"
                id="phone"
                class="registration__input"
                placeholder="+1 (234) 567-8900"
                required
                data-i18n="register.number-enter"
              />
            </div>
    
            <div class="registration__field">
              <label for="email" class="registration__label" data-i18n="register.email">E-mail*</label>
              <input
                type="email"
                id="email"
                class="registration__input"
                placeholder="you@example.com"
                required
                data-i18n="register.email-title"
              />
            </div>
    
            <div class="registration__field">
              <label for="nickname" class="registration__label" data-i18n="register.nickname">Nickname*</label>
              <input
                type="text"
                id="nickname"
                class="registration__input"
                placeholder="Choose a nickname"
                required
                data-i18n="register.nickname"
              />
            </div>
    
            <div class="registration__field">
              <label for="password" class="registration__label" data-i18n="register.password">Password*</label>
              <input
                type="password"
                id="password"
                class="registration__input"
                placeholder="Create password"
                required
                data-i18n="register.password-enter"
              />
            </div>
    
            <div class="registration__field">
              <label for="passwordRepeat" class="registration__label" data-i18n="register.repeat">Repeat Password*</label>
              <input
                type="password"
                id="passwordRepeat"
                class="registration__input"
                placeholder="Repeat password"
                required
                data-i18n="register.repeat-enter"
              />
            </div>
    
            <p class="registration__agreement" data-i18n="register.agree">
              By registering you agree to the <a href="#" class="registration__link" data-i18n="register.agreement">User Agreement</a>
            </p>
    
            <button type="submit" class="registration__button" data-i18n="register.button">Register</button>
            <p id="message"></p>
          </form>
        </div>
      </main>

      <footer class="footer">
        <div class="footer__container">
          <div class="footer__col">
            <h4 class="footer__title">Company</h4>
            <ul class="footer__list">
              <li><a href="about.html">Where are we located</a></li>
            </ul>
          </div>
          
          <div class="footer__col">
            <h4 class="footer__title">Products</h4>
            <ul class="footer__list">
              <li><a href="services.html">Our services</a></li>
            </ul>
          </div>
          
          <div class="footer__col">
            <h4 class="footer__title">Support</h4>
            <ul class="footer__list">
              <li><a href="#">Help Center</a></li>
            </ul>
          </div>
          <button class="footer__phone">+375 (29)999-99-99</button>
        </div>
      </footer>

    <script src="js/components/theme.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/pages/register.js"></script>
    <script src="js/components/i18n.js"></script>
    <script src="js/components/lang.js"></script>
</body>
</html>
